<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA制分账计算器</title>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 80px 20px 25px 20px;
            max-width: 100%;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 50px;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 500px;
                padding: 30px 30px 100px 30px;
                min-height: 700px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .logo {
                max-width: 80px;
                top: 20px;
                right: 20px;
            }

            .tabs {
                gap: 10px;
                margin-bottom: 30px;
            }

            .tab {
                padding: 12px;
                font-size: 16px;
            }

            body {
                padding: 20px;
                align-items: center;
            }
        }

        .tab.active {
            background: #00b4d8;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #00b4d8;
        }

        .result {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-amount {
            font-size: 36px;
            color: #0077b6;
            font-weight: bold;
            margin: 10px 0;
        }

        .copy-btn {
            background: #00b4d8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #0096c7;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .expense-list {
            margin-bottom: 20px;
        }

        .expense-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .expense-item input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .expense-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-expense-btn {
            width: 100%;
            background: #51cf66;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .total-expenses {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #51cf66;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .scan-btn {
            width: 100%;
            background: #00b4d8;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .scan-btn:hover {
            background: #0096c7;
        }

        .scan-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .preview-img {
            max-width: 100%;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
        }

        .preview-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .delete-preview-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 10;
        }

        .delete-preview-btn:hover {
            background: rgba(255, 59, 48, 1);
        }

        .progress {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            display: none;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .scan-history {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }

        .scan-history-title {
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 10px;
        }

        .scan-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .scan-history-item .amount {
            font-weight: bold;
            color: #28a745;
        }

        .scan-history-item .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .scan-history-total {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
        }

        .scan-history-total .amount {
            color: #0077b6;
        }

        .export-pdf-btn {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .export-pdf-btn:hover {
            background: #218838;
        }

        .export-pdf-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .next-scan-btn {
            width: 100%;
            background: #00b4d8;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-size: 15px;
            margin: 10px 0;
            display: none;
            transition: background 0.3s;
        }

        .next-scan-btn:hover {
            background: #0096c7;
        }

        .logo {
            position: absolute;
            top: 15px;
            right: 15px;
            max-width: 70px;
            height: auto;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">
        <h1>💰 AA制分账计算器</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('simple')">简单模式</button>
            <button class="tab" onclick="switchTab('multiple')">多笔消费</button>
            <button class="tab" onclick="switchTab('advance')">已付款</button>
        </div>

        <!-- 简单模式 -->
        <div id="simple" class="tab-content active">
            <button class="scan-btn" onclick="scanBill('simple')">
                📸 扫描账单识别金额
            </button>
            <input type="file" id="simpleScanInput" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'simple')">
            <div class="preview-container">
                <img id="simplePreview" class="preview-img">
                <button class="delete-preview-btn" id="simpleDeleteBtn" onclick="deletePreview('simple')" title="删除图片">×</button>
            </div>
            <div id="simpleProgress" class="progress">正在识别中...</div>
            <button class="next-scan-btn" id="simpleNextScanBtn" onclick="nextScan('simple')">📷 扫描下一张</button>

            <div id="simpleScanHistory" class="scan-history">
                <div class="scan-history-title">📋 扫描记录</div>
                <div id="simpleScanList"></div>
                <div class="scan-history-total">
                    <span>累计总额：</span>
                    <span class="amount" id="simpleScanTotal">¥0.00</span>
                </div>
                <button class="export-pdf-btn" onclick="exportScanPDF('simple')">📄 导出PDF账单</button>
            </div>

            <div class="input-group">
                <label>总金额（元）</label>
                <input type="number" id="totalAmount" placeholder="例如：520" oninput="calculateSimple()">
            </div>
            <div class="input-group">
                <label>参与人数</label>
                <input type="number" id="peopleCount" placeholder="例如：4" oninput="calculateSimple()">
            </div>
            <div class="result" id="simpleResult" style="display:none;">
                <div class="result-label">每人应付</div>
                <div class="result-amount" id="perPerson">¥0.00</div>
                <button class="copy-btn" onclick="copyResult('simple')">复制结果</button>
            </div>
        </div>

        <!-- 多笔消费 -->
        <div id="multiple" class="tab-content">
            <button class="scan-btn" onclick="scanBill('multiple')">
                📸 扫描账单识别金额
            </button>
            <input type="file" id="multipleScanInput" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'multiple')">
            <div class="preview-container">
                <img id="multiplePreview" class="preview-img">
                <button class="delete-preview-btn" id="multipleDeleteBtn" onclick="deletePreview('multiple')" title="删除图片">×</button>
            </div>
            <div id="multipleProgress" class="progress">正在识别中...</div>
            <button class="next-scan-btn" id="multipleNextScanBtn" onclick="nextScan('multiple')">📷 扫描下一张</button>

            <div id="multipleScanHistory" class="scan-history">
                <div class="scan-history-title">📋 扫描记录</div>
                <div id="multipleScanList"></div>
                <div class="scan-history-total">
                    <span>累计总额：</span>
                    <span class="amount" id="multipleScanTotal">¥0.00</span>
                </div>
                <button class="export-pdf-btn" onclick="exportScanPDF('multiple')">📄 导出PDF账单</button>
            </div>

            <div class="expense-list" id="expenseList">
                <div class="expense-item">
                    <input type="text" placeholder="消费名称（如：早餐）" class="expense-name">
                    <input type="number" placeholder="金额" class="expense-amount" oninput="calculateMultiple()">
                    <button onclick="removeExpense(this)">×</button>
                </div>
            </div>
            <button class="add-expense-btn" onclick="addExpense()">+ 添加消费</button>

            <div class="total-expenses" id="totalExpenses" style="display:none;">
                <div style="font-size: 14px; color: #856404;">总消费</div>
                <div style="font-size: 24px; font-weight: bold; color: #856404;" id="totalExp">¥0.00</div>
            </div>

            <div class="input-group">
                <label>参与人数</label>
                <input type="number" id="multiplePeople" placeholder="例如：4" oninput="calculateMultiple()">
            </div>

            <div class="result" id="multipleResult" style="display:none;">
                <div class="result-label">每人应付</div>
                <div class="result-amount" id="multiplePerPerson">¥0.00</div>
                <button class="copy-btn" onclick="copyResult('multiple')">复制结果</button>
            </div>
        </div>

        <!-- 已付款模式 -->
        <div id="advance" class="tab-content">
            <button class="scan-btn" onclick="scanBill('advance')">
                📸 扫描账单识别金额
            </button>
            <input type="file" id="advanceScanInput" accept="image/*" style="display:none" onchange="handleImageUpload(event, 'advance')">
            <div class="preview-container">
                <img id="advancePreview" class="preview-img">
                <button class="delete-preview-btn" id="advanceDeleteBtn" onclick="deletePreview('advance')" title="删除图片">×</button>
            </div>
            <div id="advanceProgress" class="progress">正在识别中...</div>
            <button class="next-scan-btn" id="advanceNextScanBtn" onclick="nextScan('advance')">📷 扫描下一张</button>

            <div id="advanceScanHistory" class="scan-history">
                <div class="scan-history-title">📋 扫描记录</div>
                <div id="advanceScanList"></div>
                <div class="scan-history-total">
                    <span>累计总额：</span>
                    <span class="amount" id="advanceScanTotal">¥0.00</span>
                </div>
                <button class="export-pdf-btn" onclick="exportScanPDF('advance')">📄 导出PDF账单</button>
            </div>

            <div class="input-group">
                <label>总金额（元）</label>
                <input type="number" id="advTotalAmount" placeholder="例如：520" oninput="calculateAdvance()">
            </div>
            <div class="input-group">
                <label>参与人数</label>
                <input type="number" id="advPeopleCount" placeholder="例如：4" oninput="calculateAdvance()">
            </div>
            <div class="input-group">
                <label>已付款金额（元）</label>
                <input type="number" id="paidAmount" placeholder="例如：300" oninput="calculateAdvance()">
            </div>
            <div class="result" id="advanceResult" style="display:none;">
                <div class="result-label">其他人每人应付给垫付者</div>
                <div class="result-amount" id="advPerPerson">¥0.00</div>
                <div style="margin-top: 10px; color: #666; font-size: 14px;" id="advDetail"></div>
                <button class="copy-btn" onclick="copyResult('advance')">复制结果</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板！</div>

    <script>
        function switchTab(tabName) {
            // 切换标签按钮状态
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // 切换内容
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }

        function calculateSimple() {
            const total = parseFloat(document.getElementById('totalAmount').value);
            const people = parseInt(document.getElementById('peopleCount').value);

            if (total > 0 && people > 0) {
                const perPerson = (total / people).toFixed(2);
                document.getElementById('perPerson').textContent = `¥${perPerson}`;
                document.getElementById('simpleResult').style.display = 'block';
            } else {
                document.getElementById('simpleResult').style.display = 'none';
            }
        }

        function addExpense() {
            const expenseList = document.getElementById('expenseList');
            const newItem = document.createElement('div');
            newItem.className = 'expense-item';
            newItem.innerHTML = `
                <input type="text" placeholder="消费名称（如：午餐）" class="expense-name">
                <input type="number" placeholder="金额" class="expense-amount" oninput="calculateMultiple()">
                <button onclick="removeExpense(this)">×</button>
            `;
            expenseList.appendChild(newItem);
        }

        function removeExpense(btn) {
            if (document.querySelectorAll('.expense-item').length > 1) {
                btn.parentElement.remove();
                calculateMultiple();
            }
        }

        function calculateMultiple() {
            const amounts = document.querySelectorAll('.expense-amount');
            let total = 0;

            amounts.forEach(input => {
                const value = parseFloat(input.value);
                if (value > 0) total += value;
            });

            const people = parseInt(document.getElementById('multiplePeople').value);

            if (total > 0) {
                document.getElementById('totalExp').textContent = `¥${total.toFixed(2)}`;
                document.getElementById('totalExpenses').style.display = 'block';
            } else {
                document.getElementById('totalExpenses').style.display = 'none';
            }

            if (total > 0 && people > 0) {
                const perPerson = (total / people).toFixed(2);
                document.getElementById('multiplePerPerson').textContent = `¥${perPerson}`;
                document.getElementById('multipleResult').style.display = 'block';
            } else {
                document.getElementById('multipleResult').style.display = 'none';
            }
        }

        function calculateAdvance() {
            const total = parseFloat(document.getElementById('advTotalAmount').value);
            const people = parseInt(document.getElementById('advPeopleCount').value);
            const paid = parseFloat(document.getElementById('paidAmount').value);

            if (total > 0 && people > 0 && paid >= 0) {
                const perPerson = total / people;
                const owedToPayer = perPerson - (paid / people);
                const othersOwe = (total - paid) / (people - 1);

                document.getElementById('advPerPerson').textContent = `¥${othersOwe.toFixed(2)}`;
                document.getElementById('advDetail').textContent =
                    `（总额¥${total} ÷ ${people}人 = 每人¥${perPerson.toFixed(2)}，已付¥${paid}）`;
                document.getElementById('advanceResult').style.display = 'block';
            } else {
                document.getElementById('advanceResult').style.display = 'none';
            }
        }

        function copyResult(mode) {
            let text = '';

            if (mode === 'simple') {
                const total = document.getElementById('totalAmount').value;
                const people = document.getElementById('peopleCount').value;
                const perPerson = document.getElementById('perPerson').textContent;
                text = `总消费：¥${total}\n参与人数：${people}人\n每人应付：${perPerson}`;
            } else if (mode === 'multiple') {
                const total = document.getElementById('totalExp').textContent;
                const people = document.getElementById('multiplePeople').value;
                const perPerson = document.getElementById('multiplePerPerson').textContent;
                text = `总消费：${total}\n参与人数：${people}人\n每人应付：${perPerson}`;
            } else if (mode === 'advance') {
                const total = document.getElementById('advTotalAmount').value;
                const people = document.getElementById('advPeopleCount').value;
                const paid = document.getElementById('paidAmount').value;
                const perPerson = document.getElementById('advPerPerson').textContent;
                text = `总消费：¥${total}\n参与人数：${people}人\n已垫付：¥${paid}\n其他人每人应付：${perPerson}`;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 扫描记录数据 (each entry: {amount, imageDataUrl})
        const scanHistories = { simple: [], multiple: [], advance: [] };

        function addScanRecord(mode, amount, imageDataUrl) {
            const history = scanHistories[mode];
            const index = history.length + 1;
            history.push({ amount, imageDataUrl });

            const list = document.getElementById(mode + 'ScanList');
            const item = document.createElement('div');
            item.className = 'scan-history-item';
            item.dataset.index = index - 1;
            item.innerHTML = `
                <span>第${index}次扫描</span>
                <span class="amount">¥${amount.toFixed(2)}</span>
                <button class="remove-btn" onclick="removeScanRecord('${mode}', ${index - 1}, this)">删除</button>
            `;
            list.appendChild(item);

            updateScanTotal(mode);
            document.getElementById(mode + 'ScanHistory').style.display = 'block';
        }

        function removeScanRecord(mode, index, btn) {
            scanHistories[mode].splice(index, 1);
            btn.closest('.scan-history-item').remove();

            const items = document.querySelectorAll(`#${mode}ScanList .scan-history-item`);
            items.forEach((item, i) => {
                item.dataset.index = i;
                item.querySelector('span:first-child').textContent = `第${i + 1}次扫描`;
                item.querySelector('.remove-btn').setAttribute('onclick', `removeScanRecord('${mode}', ${i}, this)`);
            });

            updateScanTotal(mode);
            if (scanHistories[mode].length === 0) {
                document.getElementById(mode + 'ScanHistory').style.display = 'none';
            }
        }

        function updateScanTotal(mode) {
            const total = scanHistories[mode].reduce((sum, r) => sum + r.amount, 0);
            document.getElementById(mode + 'ScanTotal').textContent = `¥${total.toFixed(2)}`;

            if (total > 0) {
                if (mode === 'simple') {
                    document.getElementById('totalAmount').value = total.toFixed(2);
                    calculateSimple();
                } else if (mode === 'advance') {
                    document.getElementById('advTotalAmount').value = total.toFixed(2);
                    calculateAdvance();
                }
            }
        }

        async function exportScanPDF(mode) {
            const history = scanHistories[mode];
            if (history.length === 0) return;

            const btn = document.querySelector(`#${mode}ScanHistory .export-pdf-btn`);
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

                const pageW = 210;
                const pageH = 297;
                const margin = 20;

                // 创建临时容器
                const container = document.createElement('div');
                container.style.cssText = 'position:absolute;left:-9999px;width:680px;background:white;padding:40px;font-family:Arial,sans-serif;';

                // 标题
                const title = document.createElement('div');
                title.style.cssText = 'font-size:28px;font-weight:bold;color:#333;margin-bottom:15px;';
                title.textContent = '账单汇总';
                container.appendChild(title);

                // 总金额
                const total = history.reduce((sum, r) => sum + r.amount, 0);
                const totalDiv = document.createElement('div');
                totalDiv.style.cssText = 'margin-bottom:10px;';
                totalDiv.innerHTML = `<span style="font-size:36px;color:#007bff;font-weight:bold;">¥${total.toFixed(2)}</span> <span style="font-size:14px;color:#888;margin-left:10px;">共${history.length}笔</span>`;
                container.appendChild(totalDiv);

                // 分割线
                const divider = document.createElement('div');
                divider.style.cssText = 'border-top:2px solid #ddd;margin:20px 0;';
                container.appendChild(divider);

                // 账单列表
                for (let i = 0; i < history.length; i++) {
                    const { amount, imageDataUrl } = history[i];

                    const itemDiv = document.createElement('div');
                    itemDiv.style.cssText = 'margin-bottom:25px;';

                    // 序号和金额
                    const header = document.createElement('div');
                    header.style.cssText = 'font-size:16px;margin-bottom:8px;';
                    header.innerHTML = `<span style="color:#666;">${i + 1}.</span> <span style="color:#28a745;font-weight:bold;">¥${amount.toFixed(2)}</span>`;
                    itemDiv.appendChild(header);

                    // 图片
                    if (imageDataUrl) {
                        const img = document.createElement('img');
                        img.src = imageDataUrl;
                        img.style.cssText = 'max-width:500px;height:auto;display:block;';
                        itemDiv.appendChild(img);
                    }

                    // 分隔线
                    if (i < history.length - 1) {
                        const separator = document.createElement('div');
                        separator.style.cssText = 'border-bottom:1px solid #eee;margin-top:15px;';
                        itemDiv.appendChild(separator);
                    }

                    container.appendChild(itemDiv);
                }

                document.body.appendChild(container);

                // 使用 html2canvas 渲染
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff'
                });

                document.body.removeChild(container);

                // 将 canvas 转换为图片并添加到 PDF
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const imgWidth = pageW - margin * 2;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                let heightLeft = imgHeight;
                let position = margin;

                doc.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
                heightLeft -= (pageH - margin * 2);

                // 如果内容超过一页，添加新页
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight + margin;
                    doc.addPage();
                    doc.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
                    heightLeft -= (pageH - margin * 2);
                }

                const dateStr = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
                doc.save(`账单_${dateStr}.pdf`);
            } catch (error) {
                console.error('PDF生成失败:', error);
                alert('PDF生成失败，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '📄 导出PDF账单';
            }
        }

        // 扫描账单功能
        function nextScan(mode) {
            deletePreview(mode);
            scanBill(mode);
        }

        function deletePreview(mode) {
            const preview = document.getElementById(mode + 'Preview');
            const deleteBtn = document.getElementById(mode + 'DeleteBtn');
            const nextScanBtn = document.getElementById(mode + 'NextScanBtn');
            const input = document.getElementById(mode + 'ScanInput');
            preview.src = '';
            preview.style.display = 'none';
            deleteBtn.style.display = 'none';
            if (nextScanBtn) nextScanBtn.style.display = 'none';
            input.value = '';
        }

        function scanBill(mode) {
            const input = document.getElementById(mode + 'ScanInput');
            input.click();
        }

        function handleImageUpload(event, mode) {
            const file = event.target.files[0];
            if (!file) return;

            const progress = document.getElementById(mode + 'Progress');
            const preview = document.getElementById(mode + 'Preview');
            const deleteBtn = document.getElementById(mode + 'DeleteBtn');
            const nextScanBtn = document.getElementById(mode + 'NextScanBtn');
            const scanBtns = document.querySelectorAll('.scan-btn');

            // 显示预览图
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                deleteBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);

            if (nextScanBtn) nextScanBtn.style.display = 'none';
            progress.style.display = 'block';
            progress.style.background = '#f0f0f0';
            progress.style.color = '#666';
            progress.textContent = '正在识别中...';
            scanBtns.forEach(btn => btn.disabled = true);

            const imgReader = new FileReader();
            imgReader.onload = async e => {
                const dataUrl = e.target.result;
                const base64 = dataUrl.split(',')[1];
                try {
                    const result = await callOCRAPI(base64);
                    if (result.texts) {
                        let handled = false;

                        // 多笔消费模式：尝试逐行提取每笔金额
                        if (mode === 'multiple' && result.words && result.words.length > 0) {
                            const lineItems = extractLineItems(result.words);
                            if (lineItems.length > 1) {
                                lineItems.forEach(amt => fillAmount('multiple', amt));
                                const total = Math.round(lineItems.reduce((s, n) => s + n, 0) * 100) / 100;
                                addScanRecord(mode, total, dataUrl);
                                progress.textContent = `✅ 识别到 ${lineItems.length} 笔消费，合计 ¥${total}`;
                                progress.style.background = '#d4edda';
                                progress.style.color = '#155724';
                                if (nextScanBtn) nextScanBtn.style.display = 'block';
                                handled = true;
                            }
                        }

                        if (!handled) {
                            const amount = extractAmount(result.texts);
                            if (amount && amount > 0) {
                                fillAmount(mode, amount);
                                addScanRecord(mode, amount, dataUrl);
                                progress.textContent = `✅ 识别成功！金额：¥${amount}`;
                                progress.style.background = '#d4edda';
                                progress.style.color = '#155724';
                                if (nextScanBtn) nextScanBtn.style.display = 'block';
                            } else {
                                throw new Error('未识别到有效金额');
                            }
                        }
                    } else {
                        throw new Error(result.error || '识别失败');
                    }
                } catch (error) {
                    progress.textContent = '❌ 识别失败，请重试或手动输入';
                    progress.style.background = '#f8d7da';
                    progress.style.color = '#721c24';
                } finally {
                    scanBtns.forEach(btn => btn.disabled = false);
                    setTimeout(() => {
                        progress.style.display = 'none';
                        progress.style.background = '#f0f0f0';
                        progress.style.color = '#666';
                    }, 3000);
                }
            };
            imgReader.readAsDataURL(file);
        }

        async function callOCRAPI(imageBase64) {
            const response = await fetch('/api/ocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageBase64 })
            });
            return await response.json();
        }

        function extractLineItems(words) {
            const skipKeywords = /合计|总计|实付|应付|总价|需付|实收|小计|应收|收款|待付|付款|找零|优惠|折扣|数量|单价|日期|时间|桌号|台号|单号|订单|谢谢|欢迎|地址|电话|服务费|税|发票|备注/;
            const datePattern = /\d{4}[\/\-年]\d{1,2}/;
            const phonePattern = /1[3-9]\d{9}/;

            const amounts = [];
            for (const line of words) {
                if (!line || !line.trim()) continue;
                if (skipKeywords.test(line)) continue;
                if (datePattern.test(line)) continue;
                if (phonePattern.test(line)) continue;
                // 行末为带小数的金额（如 8.50、128.00），认定为单项价格
                const match = line.trim().match(/(\d+\.\d{1,2})\s*$/);
                if (!match) continue;
                const amount = parseFloat(match[1]);
                if (amount >= 0.01 && amount < 10000) {
                    amounts.push(amount);
                }
            }
            return amounts;
        }

        function extractAmount(texts) {
            let amount = null;

            // 策略1: 合计/实付等关键词后的金额
            const kwMatch = texts.match(
                /(?:合计|总计|实付|应付|总价|金额|需付|实收|小计|应收|收款|待付|付款)[：:=\s]*[¥￥]?\s*(\d+(?:\.\d{1,2})?)/
            );
            if (kwMatch) amount = parseFloat(kwMatch[1]);

            // 策略2: ¥/￥ 符号旁边的数字
            if (!amount) {
                const currencyMatches = [...texts.matchAll(/[¥￥]\s*(\d+(?:\.\d{1,2})?)/g)]
                    .map(m => parseFloat(m[1])).filter(n => n > 0 && n < 100000);
                if (currencyMatches.length === 1) {
                    amount = currencyMatches[0];
                } else if (currencyMatches.length > 1) {
                    amount = currencyMatches.reduce((sum, n) => sum + n, 0);
                    amount = Math.round(amount * 100) / 100;
                }
            }

            // 策略3: 带两位小数的数字，取最后出现的
            if (!amount) {
                const decimals = [...texts.matchAll(/(?<![.\d])(\d{1,5}\.\d{2})(?![.\d])/g)]
                    .map(m => parseFloat(m[1])).filter(n => n > 0 && n < 100000);
                if (decimals.length > 0) amount = decimals[decimals.length - 1];
            }

            // 策略4: 整数金额兜底
            if (!amount) {
                const ints = [...texts.matchAll(/(?<![.\d])(\d{1,5})(?![.\d])/g)]
                    .map(m => parseFloat(m[1])).filter(n => n >= 1 && n <= 9999);
                if (ints.length > 0) amount = ints[ints.length - 1];
            }

            return amount;
        }

        function fillAmount(mode, amount) {
            if (mode === 'simple') {
                document.getElementById('totalAmount').value = amount;
                calculateSimple();
            } else if (mode === 'multiple') {
                const firstInput = document.querySelector('#expenseList .expense-amount');
                if (firstInput && !firstInput.value) {
                    firstInput.value = amount;
                } else {
                    addExpense();
                    const inputs = document.querySelectorAll('#expenseList .expense-amount');
                    const lastInput = inputs[inputs.length - 1];
                    if (lastInput) lastInput.value = amount;
                }
                calculateMultiple();
            } else if (mode === 'advance') {
                document.getElementById('advTotalAmount').value = amount;
                calculateAdvance();
            }
        }
    </script>
